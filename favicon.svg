<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Gavel or Bribe Judicial Seal">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#6B1622"/>
      <stop offset="58%" stop-color="#3D0B13"/>
      <stop offset="100%" stop-color="#0E0A0C"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9AD"/>
      <stop offset="45%" stop-color="#F5C249"/>
      <stop offset="100%" stop-color="#9C6708"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E5E38"/>
      <stop offset="55%" stop-color="#63351B"/>
      <stop offset="100%" stop-color="#33180B"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="#191513"/>
  <circle cx="64" cy="64" r="56" fill="url(#goldRim)"/>
  <circle cx="64" cy="64" r="50" fill="url(#sealBg)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#F5C249" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Balanced Brass Scales of Justice -->
  <rect x="61.5" y="26" width="5" height="68" rx="2" fill="url(#goldRim)"/>
  <rect x="46" y="91" width="36" height="6" rx="3" fill="url(#goldRim)"/>
  <rect x="31" y="38" width="66" height="4.5" rx="2.2" fill="url(#goldRim)"/>
  <circle cx="64" cy="27" r="4.5" fill="#FFE9AD"/>
  <!-- Left & Right Scale Pans -->
  <path d="M35 42 L26 62 L44 62 Z" fill="none" stroke="#FFE9AD" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 62 Q35 71 46 62 Z" fill="url(#goldRim)"/>
  <path d="M93 42 L84 62 L102 62 Z" fill="none" stroke="#FFE9AD" stroke-width="2" stroke-linejoin="round"/>
  <path d="M82 62 Q93 71 104 62 Z" fill="url(#goldRim)"/>
  <!-- Diagonal Turned Walnut & Gold Gavel -->
  <g transform="translate(64 64) rotate(-38)">
    <rect x="-5" y="-6" width="10" height="48" rx="4" fill="url(#walnut)" stroke="#FFE9AD" stroke-width="1.2"/>
    <rect x="-24" y="-22" width="48" height="20" rx="5" fill="url(#walnut)" stroke="url(#goldRim)" stroke-width="2"/>
    <rect x="-11" y="-22" width="5" height="20" fill="url(#goldRim)"/>
    <rect x="6" y="-22" width="5" height="20" fill="url(#goldRim)"/>
    <rect x="-27" y="-20" width="4" height="16" rx="1.5" fill="url(#goldRim)"/>
    <rect x="23" y="-20" width="4" height="16" rx="1.5" fill="url(#goldRim)"/>
  </g>
